# Configurações de Hardening e Mitigação para o vsftpd
# Local de instalação recomendado: /etc/vsftpd.conf

# Desabilitar login anônimo
anonymous_enable=NO

# Permitir apenas usuários locais autenticados
local_enable=YES
write_enable=YES

# Limitar os usuários ao seu próprio diretório raiz (chroot)
chroot_local_user=YES
allow_writeable_chroot=YES

# Habilitar logs detalhados de transferências e autenticação
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=YES

# Limite de conexões e taxa para mitigar força bruta e DoS
max_clients=10
max_per_ip=3

# Habilitar suporte a criptografia TLS/SSL obrigatória
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1_2=YES
ssl_tlsv1_3=YES
rsa_cert_file=/etc/ssl/certs/vsftpd.pem
rsa_private_key_file=/etc/ssl/private/vsftpd.key
